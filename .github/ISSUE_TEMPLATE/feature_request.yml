name: Feature request
description: Suggest an enhancement to the template or its utilities.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What change would solve it?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: Where does this change belong?
      options:
        - label: Branding utilities
        - label: Ethos / data utilities
        - label: Hooks
        - label: Components
        - label: CI / tooling
        - label: Documentation
